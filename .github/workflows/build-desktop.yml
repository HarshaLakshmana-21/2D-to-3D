# Builds the Floorplan3D desktop app on each OS (PyInstaller cannot cross-compile),
# runs the packaged app's --self-test on the sample plan, and uploads the result.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0 to also
# attach the builds to a GitHub Release.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Floorplan3D-windows-x64.zip
          - os: macos-latest          # Apple Silicon (arm64)
            artifact: Floorplan3D-macos-arm64.zip
          - os: ubuntu-22.04          # older glibc -> runs on more Linux distributions
            artifact: Floorplan3D-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system libraries for Qt / Qt WebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-app.txt -r requirements-build.txt

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_icons.py
          pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/floorplan3d.spec

      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Floorplan3D\Floorplan3D.exe -ArgumentList "--self-test","selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }
          Compress-Archive -Path dist\Floorplan3D -DestinationPath dist\${{ matrix.artifact }}

      - name: Self-test the packaged app (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Floorplan3D.app/Contents/MacOS/Floorplan3D --self-test selftest.json || (cat selftest.json; exit 1)
          cat selftest.json
          ditto -c -k --keepParent dist/Floorplan3D.app dist/${{ matrix.artifact }}

      - name: Self-test the packaged app (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Floorplan3D/Floorplan3D --self-test selftest.json || (cat selftest.json; exit 1)
          cat selftest.json
          cp packaging/floorplan3d.desktop dist/Floorplan3D/
          cp packaging/build_icons/app.png dist/Floorplan3D/floorplan3d.png
          tar -C dist -czf dist/${{ matrix.artifact }} Floorplan3D

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
